<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__top">
        <div class="sidebar__logo">
          <img src="assets/img/logo.png" alt="Logo" width="190" height="95">
        </div>

        <nav class="nav">
          <div class="nav__section">Navegação</div>
          <a class="nav__item" href="index.html">
            <span class="nav__icon">
              <img class="nav__icon-dashboard" src="assets/icons/dashboard.svg" alt="" width="15.5" height="16.2504">
            </span>
            Dashboard
          </a>
          <a class="nav__item" href="imoveis.html">
            <span class="nav__icon">
              <img class="nav__icon-imoveis" src="assets/icons/imoveis.svg" alt="" width="17" height="15.5">
            </span>
            Imóveis
          </a>
          <a class="nav__item" href="inquilinos.html">
            <span class="nav__icon"><img src="assets/icons/inquilinos.svg" alt="" width="18" height="18"></span>
            Inquilinos
          </a>
          <a class="nav__item" href="financeiro.html">
            <span class="nav__icon"><img src="assets/icons/financeiro.svg" alt="" width="18" height="18"></span>
            Financeiro
          </a>
          <a class="nav__item" href="documentos.html">
            <span class="nav__icon"><img src="assets/icons/documentos.svg" alt="" width="18" height="18"></span>
            Documentos
          </a>
          <a class="nav__item" href="ajuda.html">
            <span class="nav__icon"><img src="assets/icons/ajuda.svg" alt="" width="18" height="18"></span>
            Ajuda
          </a>

          <div class="nav__section nav__section--spaced">Controles</div>
          <a class="nav__item is-active is-active--neutral" href="configuracoes.html" aria-current="page">
            <span class="nav__icon"><img src="assets/icons/configuracoes.svg" alt="" width="18" height="18"></span>
            Configurações
          </a>
          <a class="nav__item" href="login.html">
            <span class="nav__icon"><img src="assets/icons/sair.svg" alt="" width="18" height="18"></span>
            Sair
          </a>
        </nav>
      </div>
      <div class="sidebar__footer"></div>
    </aside>

    <!-- Principal -->
    <main class="main">
      <header class="page-title page-title--plain page-title--ink page-title--sticky page-title--strong">
        <h1>Configurações</h1>
      </header>

      <div class="settings">
        <section class="settings__section">
          <h2 class="settings__title">Perfil</h2>
          <div class="profile">
            <span class="avatar avatar--profile" aria-hidden="true">JC</span>
            <dl class="settings__fields">
              <div>
                <dt>Nome</dt>
                <dd>José Carlos</dd>
              </div>
              <div>
                <dt>E-mail</dt>
                <dd>jose@propmanager.com</dd>
              </div>
            </dl>
          </div>
        </section>

        <hr class="separator">

        <section class="settings__section">
          <h2 class="settings__title">Notificações</h2>
          <div class="toggle-list">
            <label class="toggle-row" for="notif-email">
              <span>Notificações por e-mail</span>
              <input class="switch" type="checkbox" role="switch" id="notif-email" name="notif-email" checked>
            </label>
            <label class="toggle-row" for="notif-push">
              <span>Notificações push</span>
              <input class="switch" type="checkbox" role="switch" id="notif-push" name="notif-push">
            </label>
            <label class="toggle-row" for="notif-atraso">
              <span>Alertas de atraso</span>
              <input class="switch" type="checkbox" role="switch" id="notif-atraso" name="notif-atraso" checked>
            </label>
          </div>
        </section>

        <hr class="separator">

        <section class="settings__section">
          <h2 class="settings__title">Dados da Empresa</h2>
          <dl class="settings__fields">
            <div>
              <dt>Empresa</dt>
              <dd>GestorImoveis Ltda</dd>
            </div>
            <div>
              <dt>CNPJ</dt>
              <dd>12.345.678/0001-90</dd>
            </div>
            <div>
              <dt>Endereço</dt>
              <dd>Rua das Flores, 123</dd>
            </div>
          </dl>
        </section>

        <hr class="separator">

        <section class="settings__section">
          <h2 class="settings__title">Segurança</h2>
          <div class="settings__actions">
            <button class="btn-primary btn-primary--plain" type="button">Alterar senha</button>
            <button class="btn-secondary" type="button">Autenticação em dois fatores</button>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="assets/js/configuracoes.js"></script>
</body>
</html>
